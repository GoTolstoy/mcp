name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      action:
        description: Publish a manifest, or set a server's status (all versions)
        type: choice
        required: true
        default: publish
        options:
          - publish
          - set-status
      server:
        description: Manifest to publish (action publish)
        type: choice
        required: true
        default: tolstoy
        options:
          - tolstoy
          - closet
      name:
        description: Registry server name, e.g. io.github.GoTolstoy/studio (action set-status)
        type: string
        required: false
      status:
        description: New status (action set-status)
        type: choice
        required: true
        default: deleted
        options:
          - active
          - deprecated
          - deleted
      message:
        description: Status message, up to 500 characters (action set-status)
        type: string
        required: false

permissions:
  contents: read
  id-token: write

# Calls the registry API the way mcp-publisher 1.8.7 does, so the plugin ships no command that fetches code to run.
env:
  REGISTRY_URL: https://registry.modelcontextprotocol.io

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select server manifest
        if: inputs.action == 'publish'
        env:
          SERVER: ${{ inputs.server }}
        run: |
          case "$SERVER" in
            tolstoy|closet) echo "MANIFEST=registry/${SERVER}.server.json" >> "$GITHUB_ENV" ;;
            *) echo "::error::Unknown server: $SERVER"; exit 1 ;;
          esac

      - name: Validate server manifest
        if: inputs.action == 'publish'
        run: |
          curl --fail-with-body --silent --show-error --json @"$MANIFEST" "$REGISTRY_URL/v0/validate" |
            jq --exit-status '., .valid'

      - name: Authenticate to MCP Registry
        id: login
        run: |
          token=$(
            curl --fail-with-body --silent --show-error --get --data-urlencode "audience=$REGISTRY_URL" \
              --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" |
              jq '{oidc_token: .value}' |
              curl --fail-with-body --silent --show-error --json @- "$REGISTRY_URL/v0/auth/github-oidc" |
              jq --raw-output '.registry_token // error(tostring)'
          )
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish selected server
        if: inputs.action == 'publish'
        env:
          REGISTRY_TOKEN: ${{ steps.login.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error --json @"$MANIFEST" \
            --header "Authorization: Bearer $REGISTRY_TOKEN" "$REGISTRY_URL/v0/publish"

      - name: Set server status
        if: inputs.action == 'set-status'
        env:
          NAME: ${{ inputs.name }}
          STATUS: ${{ inputs.status }}
          MESSAGE: ${{ inputs.message }}
          REGISTRY_TOKEN: ${{ steps.login.outputs.token }}
        run: |
          [[ "$NAME" =~ ^io\.github\.GoTolstoy/[a-z0-9-]+$ ]] || { echo "::error::name must be io.github.GoTolstoy/<server>"; exit 1; }
          name=$(jq --null-input --raw-output 'env.NAME | @uri')
          jq --null-input '{status: env.STATUS} + if env.MESSAGE == "" then {} else {statusMessage: env.MESSAGE} end' |
            curl --fail-with-body --silent --show-error --json @- --request PATCH \
              --header "Authorization: Bearer $REGISTRY_TOKEN" "$REGISTRY_URL/v0/servers/$name/status"

      - name: Verify published server
        if: inputs.action == 'publish'
        run: |
          name=$(jq -r '.name | @uri' "$MANIFEST")
          version=$(jq -r '.version | @uri' "$MANIFEST")
          curl --fail --silent --show-error "https://registry.modelcontextprotocol.io/v0.1/servers/${name}/versions/${version}" --output "$RUNNER_TEMP/registry-server.json"
          jq --exit-status --slurpfile expected "$MANIFEST" '
            .server == $expected[0] and
            ._meta["io.modelcontextprotocol.registry/official"].status == "active"
          ' "$RUNNER_TEMP/registry-server.json"
